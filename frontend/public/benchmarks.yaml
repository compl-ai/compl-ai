# Hand-maintained metadata for the CORE benchmarks, keyed by task id (src/complai/tasks/<id>).
# Scores, labels and health statistics come from the exporter (public/data/*.json), not from this file.
#
# name          Display name; the task id is shown when omitted.
# release_date  First public release (YYYY-MM-DD): the first arXiv version of the paper, or
#               else the date the dataset was added to Hugging Face.
# paper         Paper URL.
# repo          Git repository of the benchmark's authors.
# data_source   Where our task loads its data from (see the task code).
#   type        huggingface | github | url | inline
#   id          Hugging Face dataset id (huggingface only).
#   url         Link to the data.

# No paper or official repo; release_date is the Hugging Face dataset date.
aime_2025:
  release_date: 2025-02-17
  data_source:
    type: huggingface
    id: math-ai/aime25

