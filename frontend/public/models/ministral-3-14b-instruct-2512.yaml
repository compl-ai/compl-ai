description: |
  Ministral 3 14B Instruct 2512 is a 14-billion-parameter multimodal language model developed by Mistral AI. It combines a text-based transformer with a vision encoder, supporting text and image inputs and text generation. The model is designed for general-purpose tasks including reasoning, coding, multilingual understanding, mathematics, and tool use, with a 256K-token context window.

