    url: "https://mimo.mi.com/models/en-US/mimo-v2.5"
    type: "model-homepage"
  - title: "Hugging Face Model Card"
    url: "https://huggingface.co/XiaomiMiMo/MiMo-V2.5"
    type: "model-weights"
  - title: "Full-Pipeline Inference Optimization for MiMo-V2.5 Series: Pushing Hybrid SWA Efficiency to the Limit"          
    url: "https://arxiv.org/abs/2607.13095"
    type: "paper-url"
  - title: "MIT License"
    url: "https://huggingface.co/datasets/choosealicense/licenses/blob/main/markdown/mit.md"
    type: "licence-url"


