
name: "MiMo-V2.5"
release_date: "2026-04-23"
open_weights: true
organization: "Xiaomi"
license: "mit"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"
  

description: |
  MiMo-V2.5 is a multimodal AI model developed by Xiaomi in China. It uses a sparse Mixture-of-Experts (MoE) Transformer architecture with 310 billion total parameters and 15 billion active parameters. It supports text, image, video, and audio inputs, with text output, and is designed for reasoning, coding, mathematical tasks, and tool use. Its context window supports up to 1 million tokens.

specs:
  architecture: "Sparse Mixture-of-Experts (MoE) Transformer"
  knowledge_cutoff: null
  total_params: 310_000_000_000
  active_params: 15_000_000_000
  context: 1_000_000
  max_output_tokens: 128_000

  modalities:
    input:
      - "text"
      - "image"
      - "video"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "tools"

sources:
