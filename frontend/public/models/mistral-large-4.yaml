name: "Mistral Large 4"
release_date: "2026-10-06"
open_weights: true
organization: "Mistral AI"
license: "mistral-ecosystem-open-weight-license"

availability:
  - "open-weights"
  - "api"

description: |
  Mistral Large 4 is Mistral AI's largest model. It is a multimodal, Mixture-of-Experts language model with 1.05 trillion total parameters and 49 billion active parameters. It supports a context window of up to 1 million tokens and is best used for reasoning, coding, and agentic workloads.

specs:
  architecture: "granular Mixture-of-Experts (MoE)"
  knowledge_cutoff: null
  total_params: 1_000_000_000_000
  active_params: 52_000_000_000
  context: 1_048_576

  modalities:
    input:
      - "text"
      - "image"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"
    - "tools"

