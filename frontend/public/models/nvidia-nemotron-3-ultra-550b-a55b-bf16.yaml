description: |
  NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16 is a 550-billion-parameter open-weight language model developed by NVIDIA. It uses a hybrid Mamba-2 and Transformer attention architecture with a LatentMixture-of-Experts design, activating approximately 55 billion parameters per token. The model is designed for reasoning, coding, mathematical problem-solving, multilingual tasks, and tool use, with support for long-context applications.

