description: |
  MiniMax-M2.7 is a sparse Mixture-of-Experts language model developed by MiniMax, with approximately 230 billion total parameters and 10 billion active parameters. It is designed for reasoning, coding, mathematical tasks, multilingual use, and tool-enabled agentic workflows, and supports a context length of approximately 205 thousand tokens.

