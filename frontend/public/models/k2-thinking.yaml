name: "Kimi K2 Thinking"
release_date: "2025-11-06"
open_weights: true
organization: "Moonshot AI"
license: "mit-modified"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"

description: |
  Kimi K2 Thinking is a 1-trillion parameter Mixture-of-Experts (MoE) reasoning model developed by Moonshot AI. This model is optimized for complex problem-solving and deep, multi-step reasoning. Kimi K2 Thinking is designed for applications requiring extensive chain-of-though analysis and tool-use capabilities, excelling in complex tasks like mathematical proofs, research synthesis, long-horizon agentic workflows, and coding.

specs:
  architecture: "Mixture-of-Experts (MoE)"
  knowledge_cutoff: null
  total_params: 1_000_000_000_000
  active_params: 32_000_000_000
  context: 256_000
  max_output_tokens: 8_192

  modalities:
    input:
      - "text"
    output:
      - "text"

  capabilities:
    - "reasoning"

sources:
  - title: "Introducing Kimi K2 Thinking"
    url: "https://moonshotai.github.io/Kimi-K2/thinking.html"
    type: "model-homepage"
  - title: "Hugging Face Model Card"
    url: "https://huggingface.co/moonshotai/Kimi-K2-Thinking"
    type: "model-weights"
  - title: "Kimi K2: Open Agentic Intelligence"
    url: "https://arxiv.org/abs/2507.20534"
    type: "paper-url"
  - title: "Kimi-K2-Thinking License"
    url: "https://huggingface.co/moonshotai/Kimi-K2-Thinking/blob/main/LICENSE"
    type: "licence-url"


training:
  tokens: 15_500_000_000_000
  compute_flops: null
  energy_kwh: null
  emissions_co2: null
  training_dataset: "web text + code + mathematics + knowledge"
  base_model: "Kimi-K2"

stats:
  inference_efficiency_tokens_per_kwh: null
  throughput_tokens_per_second: 18
  latency_ms_per_token: 2_130

region:
