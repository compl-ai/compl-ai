description: |
  Qwen3-32B is a dense, decoder-only Transformer language model with approximately 32.8 billion parameters, developed as part of Alibaba’s Qwen3 model family. It is a text-only model designed for general-purpose language understanding and generation, supporting tasks such as reasoning, coding, mathematics, and multilingual text processing.

