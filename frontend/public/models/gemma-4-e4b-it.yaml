description: |
  Gemma 4 E4B is an open-weight, multimodal language model from Google with approximately 8 billion total parameters and 4.5 billion effective parameters. It supports text, image, audio, and video inputs and generates text outputs, with capabilities including reasoning, coding, mathematics, multilingual understanding, and tool use.

