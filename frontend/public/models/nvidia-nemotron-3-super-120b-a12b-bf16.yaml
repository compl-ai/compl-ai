description: |
  NVIDIA Nemotron-3-Super-120B-A12B is a 120-billion-parameter open-weight language model developed by NVIDIA. It uses a hybrid Mamba-2–Transformer architecture with a Latent Mixture of Experts (LatentMoE) design and supports reasoning, coding, multilingual tasks, mathematical problem-solving, and tool use. The model is designed for long-context and agentic workloads, with up to a 1-million-token context window.

