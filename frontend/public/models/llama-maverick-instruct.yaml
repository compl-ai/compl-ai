description: |
  Llama-4-Maverick-17B-128E-Instruct is a 17-billion parameter, Mixture-of-Experts (MoE) multimodal language model developed by Meta. It is designed for instruction-following tasks and supports text, code, and image inputs, with capabilities in reasoning, coding, math, and multilingual understanding.

