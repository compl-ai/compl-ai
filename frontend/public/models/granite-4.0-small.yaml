  - "saas-chat"
  - "api"

description: |
  Granite‑4.0‑H‑Small is a hybrid decoder‑only large language model developed by IBM as part of the Granite 4.0 family. It combines transformer blocks with Mamba‑2 state‑space layers and a Mixture‑of‑Experts (MoE) architecture to achieve high performance with computational efficiency. The model is instruction‑tuned for text‑based tasks, supports very long context lengths (up to 128,000 tokens in practice), and is designed for applications such as conversational AI, text generation, summarization, and structured text outputs.

