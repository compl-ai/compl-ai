name: "MiniMax-M2"
release_date: "2025-10-27"
open_weights: true
organization: "MiniMax"
license: "mit-modified"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"

description: |
  MiniMax M2 is a large, open-weight text-only large language model developed by MiniMax, based on a Mixture-of-Experts (MoE) architecture with roughly 230 billion total parameters and  10 billion active parameters. It supports a long context window (approximately 200,000 tokens) and is designed for general-purpose language tasks, with strengths in reasoning, coding, and long-context processing.

specs:
  architecture: "Mixture-of-Experts (MoE)"
  knowledge_cutoff: "2025-04-28"
  total_params: 230_000_000_000
  active_params: 10_000_000_000
  context: 204_800
  max_output_tokens: 128_000

  modalities:
    input:
      - "text"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "math"
    - "tools"

sources:
  - title: "MiniMax M2 & Agent: Ingenious in Simplicity"
    url: "https://www.minimax.io/news/minimax-m2"
    type: "model-homepage"
  - title: "Hugging Face Model Card"
    url: "https://huggingface.co/MiniMaxAI/MiniMax-M2"
    type: "model-weights"
  - title: "MIT License"
    url: "https://github.com/MiniMax-AI/MiniMax-M2/blob/main/LICENSE"
    type: "licence-url"


training:
  tokens: null
  compute_flops: null
  energy_kwh: null
  emissions_co2: null
  training_dataset: "text + code"
  base_model: null

stats:
  inference_efficiency_tokens_per_kwh: null
  throughput_tokens_per_second: 100
  latency_ms_per_token: 10

region:
  region_deployable:
    - null
  region_developed:
    - “CN”
