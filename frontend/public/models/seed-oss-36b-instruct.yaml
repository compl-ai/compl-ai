
name: "Seed-OSS-36B-Instruct"
release_date: "2025-08-20"
open_weights: true
organization: "ByteDance"
license: "apache-2.0"

availability:
  - "open-weights"

description: |
  Seed-OSS-36B-Instruct is a 36-billion-parameter, open-weight language model developed by ByteDance Seed. It is a decoder-only Transformer designed for instruction following, with an emphasis on reasoning, mathematical problem-solving, coding, and agentic tasks. The model supports text input and output and is released under the Apache 2.0 license.

specs:
