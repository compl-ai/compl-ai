name: "DeepSeek-R1-Distill-Qwen-32B"
release_date: "2025-01-19"
open_weights: true
organization: "DeepSeek"
license: "mit"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"

description: |
  DeepSeek-R1-Distill-Qwen-32B is a 32-billion-parameter, text-only large language model obtained by distilling the DeepSeek-R1 reasoning model into a Qwen-32B base through supervised fine-tuning. It is designed to produce step-by-step reasoning and instruction-following outputs, and supports general language tasks such as reasoning, coding, mathematics, and multilingual text generation.

specs:
  architecture: "dense decoder-only transformer"
  knowledge_cutoff: "2024-07-23"
  total_params: 32_000_000_000
  active_params: 32_000_000_000
  context: 128_000
  max_output_tokens: 128_000

  modalities:
    input:
      - "text"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "math"

sources:
