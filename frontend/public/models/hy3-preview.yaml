
name: "Hy3 preview"
release_date: "2026-04-23"
open_weights: true
organization: "Tencent"
license: "tencent-hy-community"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"

description: |
  Hy3 preview is a 295-billion-parameter Mixture-of-Experts language model developed by Tencent. It activates approximately 21 billion parameters per token and supports a 256K-token context window. The model is designed for reasoning, coding, mathematical problem-solving, multilingual tasks, and tool use.

specs:
  architecture: "Mixture-of-Experts (MoE)"
  knowledge_cutoff: null
  total_params: 295_000_000_000
  active_params: 21_000_000_000
  context: 256_000
  max_output_tokens: 128_000

  modalities:
    input:
      - "text"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"
    - "tools"

sources:
  - title: "Introducing Hy3"
    url: "https://hy.tencent.ai/research/hy3"
    type: "model-homepage"
  - title: "Hugging Face Model Card"
    url: "https://huggingface.co/tencent/Hy3-preview"
    type: "model-weights"
  - title: "Tencent Hy Community License Agreement"
    url: "https://huggingface.co/tencent/Hy3-preview/blob/main/LICENSE"
    type: "licence-url"


