name: "Apertus-70B-2509"
release_date: "2025-09-02"
open_weights: true
organization: "Swiss AI Initiative"
license: "apache-2.0"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"

description: |
  Apertus‑70B‑2509 is a fully open, 70‑billion‑parameter language model developed by the Swiss AI Initiative (EPFL, ETH Zurich, CSCS). It is a decoder-only transformer trained from scratch on approximately 15 trillion tokens with a mixture of web, code, and math data. The model supports a very long context (65,536 tokens) and is massively multilingual, with native support for 1,811 languages.

specs:
  architecture: "dense decoder-only transformer"
  knowledge_cutoff: "2024-03"
  total_params: 71_000_000_000
  active_params: 71_000_000_000
  context: 65_536
  max_output_tokens: 32_768

  modalities:
    input:
      - "text"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"
    - "tools"

sources:
