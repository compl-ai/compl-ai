    url: "https://www.swiss-ai.org/apertus"
    type: "model-homepage"
  - title: "Hugging Face Model Card"
    url: "https://huggingface.co/swiss-ai/Apertus-70B-2509"
    type: "model-weights"
  - title: "Apertus: Democratizing Open and Compliant LLMs for Global Language Environments"
    url: "https://arxiv.org/abs/2509.14233"
    type: "paper-url"
  - title: "Apache License Version 2.0"
    url: "https://huggingface.co/datasets/choosealicense/licenses/blob/main/markdown/apache-2.0.md"
    type: "licence-url"


