
name: "Gemma 4 31B Instruct"
release_date: "2026-03-31"
open_weights: true
organization: "Google"
license: "apache-2.0"

availability:
  - "open-weights"
  - "api"
  - "saas-chat"

description: |
  Gemma 4 31B is a 30.7-billion-parameter dense multimodal language model developed by Google DeepMind. It supports text, image, and video inputs and is designed for tasks including reasoning, coding, mathematics, multilingual understanding, and tool use. The model has a 256K-token context window and is available with open weights.

specs:
  architecture: "dense transformer"
  knowledge_cutoff: "2025-01"
  total_params: 30_700_000_000
  active_params: 30_700_000_000
  context: 256_000
  max_output_tokens: null

  modalities:
    input:
      - "text"
      - "image"
      - "video"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"
    - "tools"

