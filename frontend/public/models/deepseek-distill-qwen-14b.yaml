description: |
  The DeepSeek-R1-Distill-Qwen-14B model is a 14-billion-parameter, decoder-only large language model derived from the Qwen architecture and trained using distillation from DeepSeek’s R1 reasoning model. It is designed to provide strong performance on reasoning-focused tasks while maintaining a smaller parameter count than full-scale R1 models, making it suitable for research and deployment scenarios that prioritize efficiency.

