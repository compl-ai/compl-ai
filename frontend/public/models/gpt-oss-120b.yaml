
name: "gpt-oss-120b"
release_date: "2025-08-05"
open_weights: true
organization: "OpenAI"
license: "apache-2.0"

availability:
  - "open-weights"
  - "saas-chat"

description: |
  gpt-oss-120b is a fully open-weights, 120-billion-parameter large language model released as part of the gpt-oss family. It is architecturally similar to modern GPT-style dense transformer models and is trained on a broad mixture of public web, code, academic, and multilingual text sources. The model is designed to provide high-quality reasoning, instruction following, and general-purpose generative capability while remaining fully transparent and reproducible for research and development.

specs:
  architecture: "Mixture-of-Experts (MoE)"
  knowledge_cutoff: "2024-06-01"
  total_params: 117000000000
  active_params: 5100000000
  context: 131072
  max_output_tokens: 131072

  modalities:
    input:
      - "text"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"
    - "tools"

