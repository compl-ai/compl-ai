description: |
  Gemma 4 12B Unified is a 12-billion-parameter, encoder-free multimodal language model developed by Google DeepMind. It accepts text, images, audio, and video as input and generates text, with support for reasoning, coding, multilingual tasks, mathematics, and tool use.

specs:
