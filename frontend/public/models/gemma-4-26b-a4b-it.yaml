
name: "Gemma 4 26B A4B"
release_date: "2026-03-31"
open_weights: true
organization: "Google"
license: "apache-2.0"

availability:
  - "open-weights"
  - "api"
  - "saas-chat"

description: |
  Gemma 4 26B A4B is an open-weight multimodal language model from Google DeepMind that uses a mixture-of-experts (MoE) architecture with approximately 26 billion total parameters and 4 billion active parameters. It supports text and image inputs and is designed for tasks including reasoning, coding, mathematics, multilingual understanding, and tool use.

specs:
  architecture: "Mixture-of-Experts (MoE)"
  knowledge_cutoff: "2025-01"
  total_params: 25_200_000_000
  active_params: 3_800_000_000
  context: 256_000
  max_output_tokens: null

  modalities:
    input:
      - "text"
      - "image"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"
    - "tools"

