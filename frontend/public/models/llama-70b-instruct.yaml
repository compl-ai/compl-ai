name: "Llama-3.3-70B-Instruct"
release_date: "2024-12-06"
open_weights: true
organization: "Meta"
license: "llama3.3"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"

description: |
  The Llama-3.3-70B-Instruct model is a 70-billion-parameter instruction-tuned language model from Meta’s Llama 3.3 family. It is trained on roughly 15 trillion tokens of publicly available text and further refined using a mixture of public instruction datasets and synthetic data. The model is designed to follow user prompts, generate coherent responses, and handle a wide range of general-purpose language tasks.

specs:
  architecture: "dense decoder-only transformer"
  knowledge_cutoff: "2023-12"
  total_params: 70_000_000_000
  active_params: 70_000_000_000
  context: 128_000
  max_output_tokens: null

  modalities:
    input:
      - "text"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"
    - "tools"

sources:
