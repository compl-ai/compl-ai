description: |
  Qwen3.5-397B-A17B is an open-weight model with 397 billion total parameters, of which 17 billion are activated per forward pass. It uses a hybrid attention architecture combining linear attention and gated attention to balance computational efficiency with long-context processing. The model supports text, image, and video inputs, with text output, and is designed for reasoning, coding, mathematical tasks, multilingual processing, and tool use.

specs:
  architecture: "Hybrid Gated DeltaNet + Gated Attention"
  knowledge_cutoff: null
