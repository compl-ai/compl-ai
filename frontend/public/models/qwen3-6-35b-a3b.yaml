description: |
  Qwen3.6-35B-A3B is an open-weight multimodal language model developed by Alibaba's Qwen team. It uses a sparse Mixture-of-Experts (MoE) architecture with 35 billion total parameters and approximately 3 billion active parameters per token. The model supports text, image, and video inputs, and is designed for reasoning, coding, mathematical problem-solving, multilingual tasks, and tool use.


specs:
