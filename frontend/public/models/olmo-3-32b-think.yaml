
name: "Olmo 3 32B Think"
release_date: "2025-11-20"
open_weights: true
organization: "Ai2"
license: "apache-2.0"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"

description: |
  Olmo 3 32B Think is a 32-billion-parameter, fully open large language model developed by the Allen Institute for AI (AI2) as part of the Olmo 3 family. It is a decoder-only transformer model designed primarily for advanced reasoning and multi-step problem solving, with strong performance on tasks involving logic, math, and coding. The model supports a long context window (up to approximately 65,000 tokens) and is released with transparent access to its training weights, data, and development process. It sits alongside other Olmo variants (like base and instruct models) and is intended as a research platform for complex reasoning workloads.

specs:
  architecture: "dense decoder-only transformer"
  knowledge_cutoff: "2024-12"
  total_params: 32000000000
  active_params: 32000000000
  context: 65536
  max_output_tokens: 65536

  modalities:
    input:
      - "text"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "math"
    - "tools"

sources:
  - title: "Olmo 3: Charting a path through the model flow to lead open-source AI"
    url: "https://allenai.org/blog/olmo3"
    type: "model-homepage"
  - title: "Hugging Face Model Card"
    url: "https://huggingface.co/allenai/Olmo-3-32B-Think"
    type: "model-weights"
  - title: "Olmo 3"
    url: "https://arxiv.org/abs/2512.13961"
    type: "paper-url"
  - title: "Apache License Version 2.0"
    url: "https://huggingface.co/datasets/choosealicense/licenses/blob/main/markdown/apache-2.0.md"
    type: "licence-url"

