    url: "https://docs.z.ai/guides/llm/glm-4.6"
    type: "model-homepage"
  - title: "Hugging Face Model Card"
    url: "https://huggingface.co/zai-org/GLM-4.6"
    type: "model-weights"
  - title: "GLM-4.5: Agentic, Reasoning, and Coding (ARC) Foundation Models"          
    url: "https://arxiv.org/abs/2508.06471"
    type: "paper-url"
  - title: "MIT License"
    url: "https://huggingface.co/datasets/choosealicense/licenses/blob/main/markdown/mit.md"
    type: "licence-url"


