name: "GLM-4.6"
release_date: "2025-09-30"
open_weights: true
organization: "Zhipu AI"
license: "mit"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"

description: |
  GLM-4.6 is a large-scale Mixture-of-Experts (MoE) language model developed by Zhipu AI. The model was trained on a 15-trillion-token corpus covering general text, multilingual data, code, and reasoning-oriented content. GLM-4.6 is designed for broad language understanding and generation tasks, offering capabilities in reasoning, multilingual dialogue, and coding assistance. It is available for direct download, research, and commercial deployment.

specs:
  architecture: "Mixture-of-Experts (MoE)"
  knowledge_cutoff: "2025-06"
  total_params: 357_000_000_000
  active_params: 32_000_000_000
  context: 200_000
  max_output_tokens: 128_000

  modalities:
    input:
      - "text"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"
    - "tools"

sources:
