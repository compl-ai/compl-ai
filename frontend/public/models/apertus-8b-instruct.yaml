  - "saas-chat"
  - "api"

description: |
  Apertus‑8B‑Instruct‑2509 is a fully open instruction‑tuned language model developed by the Swiss AI Initiative. Built on a high‑capacity 8-billion‑parameter transformer, it is fine‑tuned to follow user instructions and perform well in conversational or directive settings. The model supports an extremely long context length (65,536 tokens) and is trained to handle multilingual inputs, code, and mathematical reasoning.

specs:
  architecture: "dense decoder-only transformer"
  knowledge_cutoff: "2024-03"
  total_params: 8_000_000_000
  active_params: 8_000_000_000
  context: 65_536
  max_output_tokens: 32_768

  modalities:
