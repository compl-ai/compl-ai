name: "Kolibri-1"
release_date: "2026-10-03"
open_weights: true
organization: "Aleph Alpha"
license: "apache-2.0"

availability:
  - "open-weights"

description: |
  Kolibri-1 is a German and English language model from the German company Aleph Alpha, trained from scratch on infrastructure in Germany and Finland. It is a Mixture-of-Experts model with about 78 billion parameters, of which only about 3.5 billion are used for each word it processes, and it has an optional step-by-step reasoning mode. It is meant for multi-step reasoning, answering questions over documents, calling external tools and coding; the weights are published under the Apache 2.0 license, and the version evaluated here is the 8-bit (FP8) release served locally.

specs:
  architecture: "Mixture-of-Experts (MoE)"
  knowledge_cutoff: "2026-06"
  total_params: 78103074560
  active_params: 3457573120
  context: 1048576

  modalities:
    input:
      - "text"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"
    - "tools"

sources:
