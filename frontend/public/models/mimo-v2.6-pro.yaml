name: "MiMo-V2.6-Pro"
release_date: "2026-09-22"
open_weights: true
organization: "Xiaomi"
license: "mit"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"

description: |
  MiMo-V2.6-Pro is the largest model in Xiaomi's MiMo-V2.6 series. It is a Mixture-of-Experts model with about 1.02 trillion parameters, of which 42 billion are used for each token, and it accepts text, images, video and audio and replies in text, with a context window of about 1 million tokens. It is built for long, multi-step agent work such as coding and tool use, and Xiaomi has published its weights under the MIT license.

specs:
  architecture: "Mixture-of-Experts (MoE)"
  knowledge_cutoff: null
  total_params: 1020000000000
  active_params: 42000000000
  context: 1048576

  modalities:
    input:
      - "text"
      - "image"
      - "video"
      - "audio"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "tools"

