description: |
  A mid-priced OpenAI model from the GPT-6.1 series, released in October 2026, costing more than GPT-6 Luna and less than GPT-6.1 Sol. It is aimed at understanding images such as screenshots and technical drawings, operating computer applications on a user's behalf, and writing. It accepts text and images, and can reason step by step before answering, with an adjustable amount of reasoning effort.

