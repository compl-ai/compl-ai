description: |
  Qwen3.5-27B is a 27-billion-parameter dense multimodal language model developed by Alibaba's Qwen team. It uses a hybrid Gated DeltaNet and Gated Attention architecture and supports text, image, and video inputs. The model is designed for reasoning, coding, mathematical problem-solving, multilingual tasks, and tool use.

