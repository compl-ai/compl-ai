name: "DeepSeek-V4.1-Flash"
release_date: "2026-09-09"
open_weights: true
organization: "DeepSeek"
license: "mit"

availability:
  - "open-weights"
  - "api"

description: |
  DeepSeek's multimodal (text and image) Mixture-of-Experts model with 552B parameters and a 1M-token context, trained from scratch on 45T tokens. It activates 16B parameters per generated token, and only 8B while reading the prompt, which makes long inputs cheap.

specs:
  architecture: "Mixture-of-Experts (MoE)"
  knowledge_cutoff: null
  total_params: 552000000000
  active_params: 16000000000
  context: 1048576

  modalities:
    input:
      - "text"
      - "image"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"
    - "tools"

