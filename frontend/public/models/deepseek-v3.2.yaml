name: "DeepSeek-V3.2"
release_date: "2025-12-01"
open_weights: true
organization: "DeepSeek"
license: "mit"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"

description: |
  DeepSeek-V3.2 is a large decoder-only transformer language model developed by DeepSeek, built using a Mixture-of-Experts (MoE) architecture. It is designed for text-only input and output and supports long-context processing. The model is part of the DeepSeek-V3 series and is made available through hosted services and APIs, with open-weight releases for research and development use.

specs:
  architecture: "Mixture-of-Experts (MoE)"
  knowledge_cutoff: null
  total_params: 685_000_000_000
