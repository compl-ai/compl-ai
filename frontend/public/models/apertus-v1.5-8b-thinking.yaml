name: "Apertus 1.5 8B (thinking)"
release_date: "2026-07-24"
open_weights: true
organization: "Swiss AI Initiative"
license: "apache-2.0"

availability:
  - "open-source"
  - "open-weights"
  - "api"

description: |
  Apertus 1.5 8B is an 8-billion-parameter language model from the Swiss AI Initiative, a research collaboration of EPFL, ETH Zurich and the Swiss National Supercomputing Centre, and this card covers it with its optional thinking mode switched on, so it reasons step by step before answering. It uses the same downloadable weights as the standard Apertus 1.5 8B: thinking is a setting chosen at request time, not a separate model. The developer notes that tool calling is not supported in thinking mode.

specs:
  architecture: "dense decoder-only transformer"
  knowledge_cutoff: null
  total_params: 8000000000
  active_params: null
  context: 262144

  modalities:
    input:
      - "text"
      - "image"
      - "audio"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"

