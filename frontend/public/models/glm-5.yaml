
name: "GLM-5"
release_date: "2026-02-11"
open_weights: true
organization: "Zhipu AI"
license: "mit"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"

description: |
  GLM-5 is a large Mixture-of-Experts language model developed by Z.ai, with 744 billion total parameters and 40 billion active parameters. It uses DeepSeek Sparse Attention (DSA) and is designed for reasoning, coding, mathematical tasks, multilingual applications, and agentic tool use.

specs:
  architecture: "Mixture-of-Experts (MoE) with DeepSeek Sparse Attention (DSA)"
  knowledge_cutoff: null
  total_params: 744_000_000_000
  active_params: 40_000_000_000
  context: 202_752
  max_output_tokens: 131_072

  modalities:
    input:
      - "text"
      - "image"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"
    - "tools"

sources:
  - title: "The model that thinks before it answers."
    url: "https://glm5.ai/"
    type: "model-homepage"
  - title: "Hugging Face Model Card"
    url: "https://huggingface.co/zai-org/GLM-5"
    type: "model-weights"
  - title: "GLM-5: from Vibe Coding to Agentic Engineering"          
    url: "https://arxiv.org/abs/2602.15763"
    type: "paper-url"
  - title: "MIT License"
    url: "https://huggingface.co/datasets/choosealicense/licenses/blob/main/markdown/mit.md"
    type: "licence-url"


