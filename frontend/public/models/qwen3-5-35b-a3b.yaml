
name: "Qwen3.5-35B-A3B"
release_date: "2026-02-24"
open_weights: true
organization: "Alibaba Cloud"
license: "apache-2.0"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"

description: |
  Qwen3.5-35B-A3B is an open-weight multimodal language model developed by Alibaba's Qwen team. It uses a hybrid Mixture-of-Experts (MoE) architecture with 35 billion total parameters and approximately 3 billion active parameters per token. It supports text, image, and video inputs, with text generation, and is designed for reasoning, coding, mathematical problem-solving, multilingual tasks, and tool use.

specs:
  architecture: "Hybrid Gated DeltaNet + Gated Attention"
  knowledge_cutoff: null
  total_params: 35_000_000_000
  active_params: 3_000_000_000
  context: 262_144
  max_output_tokens: 65_536

  modalities:
    input:
      - "text"
      - "image"
      - "video"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"
    - "tools"

