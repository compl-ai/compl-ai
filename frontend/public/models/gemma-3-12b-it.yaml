name: "Gemma 3 12B Instruct"
release_date: "2025-03-10"
open_weights: true
organization: "Google"
license: "gemma"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"

description: |
  Gemma 3 12B Instruct is a 12‑billion‑parameter instruction‑tuned large language model from Google’s Gemma 3 family. It is built to follow natural language instructions and generate text responses across a wide range of tasks, such as question answering, summarization, reasoning, and conversation. The model supports multimodal input (text and images), a very long context window (up to approximately 128,000 tokens), and multilingual understanding across more than 140 languages. Its weights are openly available, making it suitable for deployment in research and development environments with moderate compute resources.

specs:
  architecture: "decoder-only transformer"
  knowledge_cutoff: "2024-08"
  total_params: 12_000_000_000
  active_params: 12_000_000_000
  context: 128_000
  max_output_tokens: 128_000

  modalities:
    input:
      - "text"
      - "image"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"

sources:
