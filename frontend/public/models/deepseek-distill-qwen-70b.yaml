name: "DeepSeek-R1-Distill-Llama-70B"
release_date: "2025-01-19"
open_weights: true
organization: "DeepSeek"
license: "mit"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"

description: |
  DeepSeek‑R1‑Distill‑Llama‑70B is a 70‑billion‑parameter dense transformer language model distilled from the larger DeepSeek‑R1 model. It is based on Meta’s Llama‑3.3‑70B‑Instruct architecture and fine‑tuned to improve reasoning, instruction-following, and problem-solving capabilities. The model can perform tasks in reasoning, coding, and math, and is designed for text generation and instruction‑following applications.

specs:
  architecture: "dense decoder-only transformer"
  knowledge_cutoff: "2024-07-23"
  total_params: 71_000_000_000
  active_params: 71_000_000_000
  context: 32_768
  max_output_tokens: 32_768

  modalities:
    input:
      - "text"
    output:
      - "text"

  capabilities:
