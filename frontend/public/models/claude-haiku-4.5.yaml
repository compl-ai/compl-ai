  - "saas-chat"

description: |
  Claude Haiku 4.5 is a proprietary large language model developed by Anthropic as part of the Claude 4.5 series. It is designed to provide fast, cost‑efficient natural language understanding and generation, supporting text and image inputs and producing text outputs. Haiku 4.5 is positioned as a lightweight, high‑throughput variant in the Claude 4.5 family, optimized for applications where speed, efficiency, and affordability are prioritized over maximum model size or raw reasoning capacity. It is accessible via Anthropic’s API and hosted platforms but does not have open weights or an open-source license.

