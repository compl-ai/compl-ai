name: "MiniMax-M2.5"
release_date: "2026-02-12"
open_weights: true
organization: "MiniMax"
license: "mit-modified"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"

description: |
  MiniMax-M2.5 is a Mixture-of-Experts language model developed by MiniMax, with approximately 229 billion total parameters and 10 billion active parameters per token. It is designed for reasoning, coding, multilingual tasks, mathematics, and agentic tool use, and supports a context length of up to 196 thousand tokens.

specs:
  architecture: "Mixture-of-Experts (MoE)"
  knowledge_cutoff: null
  total_params: 229_000_000_000
  active_params: 10_000_000_000
  context: 196_608
  max_output_tokens: 32_768

  modalities:
    input:
      - "text"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"
    - "tools"

