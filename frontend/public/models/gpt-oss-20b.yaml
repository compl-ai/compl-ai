
name: "gpt-oss-20b"
release_date: "2025-08-05"
open_weights: true
organization: "OpenAI"
license: "apache-2.0"

availability:
  - "open-weights"
  - "saas-chat"

description: |
  gpt-oss-20B is an open-source large language model with roughly 21 billion parameters. It’s designed as a general-purpose text generator and reasoning model, suitable for research, experimentation, and downstream fine-tuning. The model was trained entirely on publicly available datasets, and its open licensing makes it accessible for academic and community projects. While performance varies depending on the implementation and hardware setup, the model is intended to provide a balance between capability and compute requirements, sitting between lightweight models and very large frontier systems.

specs:
  architecture: "Mixture-of-Experts (MoE)"
  knowledge_cutoff: "2024-06-01"
  total_params: 21000000000
  active_params: 3600000000
  context: 131072
  max_output_tokens: 131072

  modalities:
    input:
      - "text"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"
    - "tools"

sources:
