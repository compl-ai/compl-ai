
name: "DeepSeek-V4-Flash"
release_date: "2026-04-24"
open_weights: true
organization: "DeepSeek"
license: "mit"

availability:
  - "open-weights"
  - "api"
  - "saas-chat"

description: |
  DeepSeek-V4-Flash is a 284-billion-parameter Mixture-of-Experts language model with 13 billion active parameters per token. It supports long-context processing of up to 1 million tokens and is designed for reasoning, coding, mathematics, multilingual tasks, and tool use.

specs:
  architecture: "Mixture-of-Experts (MoE)"
  knowledge_cutoff: "2025-05"
  total_params: 284_000_000_000
  active_params: 13_000_000_000
  context: 1_000_000
  max_output_tokens: 393_216

  modalities:
    input:
      - "text"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"
    - "tools"

