description: |
  Mistral-Nemo-Base-2407 is a 12-billion-parameter open-weight language model jointly released by Mistral AI and NVIDIA in July 2024. It is designed as a general-purpose, multilingual model capable of long-context processing and function-calling. As a base model, it is trained for broad text understanding and generation rather than instruction tuning, making it suitable for downstream fine-tuning, application integration, and research use.

