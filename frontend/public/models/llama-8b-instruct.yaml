    url: "https://www.llama.com/docs/model-cards-and-prompt-formats/llama3_1/"
    type: "model-homepage"
  - title: "Hugging Face Model Card"
    url: "https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct"
    type: "model-weights"
  - title: "The Carbon Footprint of Machine Learning Training Will Plateau, Then Shrink"
    url: "https://arxiv.org/abs/2204.05149"
    type: "paper-url"
  - title: "Llama 3.1 Community License Agreement"
    url: "https://huggingface.co/meta-llama/Llama-3.1-70B-Instruct/blob/main/LICENSE"
    type: "licence-url"


