name: "Llama-3.1-8B-Instruct"
release_date: "2024-07-23"
open_weights: true
organization: "Meta"
license: "llama3.1"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"

description: |
  Llama‑3.1‑8B‑Instruct is an 8-billion-parameter language model developed by Meta as part of the Llama‑3.1 family. It is fine-tuned for instruction-following tasks, supports multilingual text and code generation, and is designed for reasoning, coding, math, and general-purpose text applications. The model is pretrained on a large corpus of publicly available text and further instruction-tuned on both curated datasets and synthetic instruction examples.

specs:
  architecture: "dense decoder-only transformer"
  knowledge_cutoff: "2023-12"
  total_params: 8_000_000_000
  active_params: 8_000_000_000
  context: 128_000
  max_output_tokens: 8_000

  modalities:
    input:
      - "text"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"
    - "tools"

sources:
