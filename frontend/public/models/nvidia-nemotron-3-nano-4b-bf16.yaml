description: |
  NVIDIA-Nemotron-3-Nano-4B-BF16 is a 4-billion-parameter, text-to-text language model developed by NVIDIA. It uses a hybrid Mamba2-Transformer architecture and supports long-context processing of up to 262K tokens, with capabilities including reasoning, coding, mathematics, and tool use.

specs:
