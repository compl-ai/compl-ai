name: "DeepSeek-V3"
release_date: "2024-12-27"
open_weights: true
organization: "DeepSeek"
license: "DeepSeek License Agreement"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"

description: |
  DeepSeek-V3 is a large-scale, text-only large language model developed by DeepSeek-AI. It is designed for general-purpose language understanding and generation, with capabilities that include reasoning, coding, mathematical problem solving, and multilingual text processing. The model is released with open weights and can be deployed via self-hosting or accessed through hosted services, making it suitable for research and practical applications.

specs:
  architecture: "Mixture-of-Experts (MoE)"
  knowledge_cutoff: "2024-11"
  total_params: 671_000_000_000
  active_params: 37_000_000_000
  context: 128_000
  max_output_tokens: 8_192

  modalities:
    input:
      - "text"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"

sources:
