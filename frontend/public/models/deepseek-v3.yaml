    url: "https://deepseekv3.org/"
    type: "model-homepage"
  - title: "Hugging Face Model Card"
    url: "https://huggingface.co/deepseek-ai/DeepSeek-V3"
    type: "model-weights"
  - title: "DeepSeek-V3 Technical Report"
