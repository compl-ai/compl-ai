name: "Kimi K3.1 Pro"
release_date: "2026-10-24"
open_weights: true
organization: "Moonshot AI"
license: "mit-modified"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"

description: |
  Kimi K3.1 Pro is an open-weight Mixture-of-Experts model from Moonshot AI with about 2.8 trillion parameters, of which 104 billion are used for each token. It is a further-trained version of Kimi K3 that reads text, images and video, has a thinking mode and a 1-million-token context window, and is aimed at long multi-step coding, 3D modelling and financial research tasks that use tools. It is a different model from Kimi K3 and from the faster Kimi K3.1 Pro Highspeed variant.

specs:
  architecture: "Mixture-of-Experts (MoE)"
  knowledge_cutoff: null
  total_params: 2800000000000
  active_params: 104000000000
  context: 1048576

  modalities:
    input:
      - "text"
      - "image"
      - "video"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "tools"

