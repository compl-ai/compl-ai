name: "Kimi K2"
release_date: "2025-07-11"
open_weights: true
organization: "Moonshot AI"
license: "mit-modified"

availability:
  - "open-weights"
  - "saas-chat"

description: |
  Kimi K2 is Moonshot AI's open-weight Mixture-of-Experts (MoE) base model featuring 1T total parameters with 32B active parameters. It provides a strong foundation model with long-context capabilities (256K tokens), efficient MoE routing, and high-quality general reasoning, coding, and multilingual performance. This entry describes the base Kimi K2 model only, not the Kimi K2 Thinking variant.

specs:
  architecture: "Mixture-of-Experts (MoE)"
  knowledge_cutoff: null
  total_params: 1_000_000_000_000
  active_params: 32_000_000_000   # integer active parameters per token (for MoE)
  context: 256_000
  max_output_tokens: null

  modalities:
    input:
      - "text"
    output:
      - "text"

  capabilities:
    - "reasoning"

sources:
  - title: "Kimi K2: Open Agentic Intelligence"
    url: "https://moonshotai.github.io/Kimi-K2/"
    type: "model-homepage"
  - title: "Hugging Face Model Card"
    url: "https://huggingface.co/moonshotai/Kimi-K2-Base"
    type: "model-weights"
  - title: "Kimi K2 Paper"
    url: "https://arxiv.org/abs/2509.07604"
    type: "paper-url"
  - title: "Kimi K2 License"
    url: "https://huggingface.co/moonshotai/Kimi-K2/blob/main/LICENSE"
    type: "licence-url"


training:
  tokens: 15.5
  compute_flops: null
  energy_kwh: null # estimated energy consumption in kWh or null
  emissions_co2: null   # estimated CO2 emissions in kg or null
  training_dataset: null # short name or description of datasets, or null
  base_model: "Kimi-K2" # name of base or parent model (string)

stats:
  inference_efficiency_tokens_per_kwh: null  # tokens per kWh (float) or null
  throughput_tokens_per_second: null  # tokens per second at reference batch size
  latency_ms_per_token: null   # milliseconds per generated token (float) or null

region:
  # use ISO country codes or high-level region tags, or leave as null
  region_deployable:
    - null
  region_developed:
    - null
