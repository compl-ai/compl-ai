name: "Hy3"
release_date: "2026-07-06"
open_weights: true
organization: "Tencent"
license: "apache-2.0"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"

description: |
  Hy3 is a Mixture-of-Experts language model developed by Tencent. It comprises 295 billion parameters, with 21 billion activated per token. It support a 256K-token context window, and is designed for reasoning, agentic workflows and production use. Hy3 succeeds Hy3 Preview with scaled-up post-training.

specs:
  architecture: "Mixture-of-Experts (MoE)"
  knowledge_cutoff: null
  total_params: 295_000_000_000
  active_params: 21_000_000_000
  context: 262_144

  modalities:
    input:
      - "text"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"
    - "tools"

sources:
  - title: "Introducing Hy3"
    url: "https://hy.tencent.ai/research/hy3"
    type: "model-homepage"
  - title: "Hugging Face Model Card"
    url: "https://huggingface.co/tencent/Hy3"
    type: "model-weights"
  - title: "Apache License Version 2.0"
    url: "https://huggingface.co/datasets/choosealicense/licenses/blob/main/markdown/apache-2.0.md"
    type: "licence-url"

training:
  tokens: null
  compute_flops: null
  energy_kwh: null
  emissions_co2: null
  training_dataset: "multilingual web data + reference materials + technical documentation + code + synthetic and human-generated text"
  base_model: null

stats:
  inference_efficiency_tokens_per_kwh: null
  throughput_tokens_per_second: 42
  latency_ms_per_token: 23.8

region:
  region_deployable:
    - null
  region_developed:
    - "CN"

evals:
  - "openrouter/tencent/hy3"
