name: "Qwen3-8B"
release_date: "2025-04-28"
open_weights: true
organization: "Alibaba Cloud"
license: "apache-2.0"

availability:
  - "open-weights"
  - "api"

description: |
  Qwen3-8B is an 8-billion-parameter large language model developed by Alibaba Cloud as part of the Qwen3 series. It was built on a transformer-based architecture and is released under an open-weight license, making it accessible for research and commercial use. The model is designed to provide strong performance in general instruction following, multilingual understanding, reasoning, and code generation while maintaining relatively efficient inference compared to larger models.

specs:
  architecture: "dense decoder-only transformer"
  knowledge_cutoff: null
  total_params: 8_200_000_000
  active_params: 8_200_000_000
  context: 32_768
  max_output_tokens: 32_768

  modalities:
    input:
      - "text"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"
    - "tools"

