name = "Kimi K2 Thinking"
release_date = "2025-11-6"
open_weights = true # Are weights publicly available?
organization = "Moonshot AI"
license = "mit-modified" 
availability = ["api-access", "cloud-deployable"]  #api access, cloud-deployable, open-weight, announced, deprecated
description = """
Our best open-source thinking model. Built as a thinking agent, it reasons step by step while using tools, achieving state-of-the-art performance on Humanity's Last Exam (HLE), BrowseComp, and other benchmarks, with major gains in reasoning, agentic search, coding, writing, and general capabilities.
Kimi K2 Thinking can execute up to 200 – 300 sequential tool calls without human interference, reasoning coherently across hundreds of steps to solve complex problems.
"""   

#inclusion_criteria = """
#Kimi K2 Thinking is included in the registry because it represents a significant advancement in open-source AI models, particularly in reasoning and tool-use capabilities. Its ability to perform complex tasks through extended reasoning and tool interactions sets it apart from previous models.
#"""


