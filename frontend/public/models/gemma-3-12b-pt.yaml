name: "Gemma 3 PT 12B"
release_date: "2025-03-10"
open_weights: true
organization: "Google"
license: "gemma"

availability:
  - "open-weights"
  - "api"

description: |
  Gemma 3 PT 12B is a pre-trained, 12-billion-parameter multimodal language model from Google’s Gemma 3 family. It can process text and images and generate text, support long contexts (up to approximately 128,000 tokens), and offers broad multilingual understanding across many languages. The model is designed for general language tasks such as reasoning, summarization, and understanding without being fine-tuned for specific instruction or dialogue behaviours.

specs:
  architecture: "decoder-only transformer"
  knowledge_cutoff: "2024-08"
  total_params: 12_000_000_000
  active_params: 12_000_000_000
  context: 128_000
  max_output_tokens: 128_000

  modalities:
    input:
      - "text"
      - "image"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"

sources:
  - title: "Gemma 3 Model Card"
    url: "https://ai.google.dev/gemma/docs/core/model_card_3"
    type: "model-homepage"
  - title: "Gemma Checkpoints"
    url: "https://gemma-llm.readthedocs.io/en/stable/checkpoints.html"
    type: "model-weights"
  - title: "Gemma 3 Technical Report"
    url: "https://storage.googleapis.com/deepmind-media/gemma/Gemma3Report.pdf"
    type: "paper-url"
  - title: "Gemma Terms of Use"
    url: "https://ai.google.dev/gemma/terms"
    type: "licence-url"


training:
  tokens: 12_000_000_000_000
  compute_flops: null
  energy_kwh: null
  emissions_co2: null
  training_dataset: "web documents + code + math + images"
  base_model: null

stats:
  inference_efficiency_tokens_per_kwh: null
  throughput_tokens_per_second: 33
  latency_ms_per_token: 30

region:
  region_deployable:
    - null
  region_developed:
    - “GB-ENG”
