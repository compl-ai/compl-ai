name: "Gemma 3 27B Instruct"
release_date: "2025-03-10"
open_weights: true
organization: "Google"
license: "gemma"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"

description: |
  Gemma 3 27B Instruct is a large instruction-tuned language model developed by Google with about 27 billion parameters. It belongs to the Gemma 3 family of open models designed for versatile generative AI tasks. The model supports a very long context window (up to approximately 128,000 tokens), multilingual understanding across more than 140 languages, and multimodal capabilities including text and image input (with text output). It is optimized for a variety of applications such as text generation, summarization, question answering, reasoning, and coding-related tasks.

specs:
  architecture: "decoder-only transformer"
  knowledge_cutoff: "2024-08"
  total_params: 27_000_000_000
  active_params: 27_000_000_000
  context: 128_000
  max_output_tokens: 128_000

  modalities:
    input:
      - "text"
      - "image"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"

sources:
  - title: "Gemma 3 Model Card"
    url: "https://ai.google.dev/gemma/docs/core/model_card_3"
    type: "model-homepage"
  - title: "Hugging Face Model Card"
    url: "https://huggingface.co/google/gemma-3-27b-it"
    type: "model-weights"
  - title: "Gemma 3 Technical Report"
    url: "https://storage.googleapis.com/deepmind-media/gemma/Gemma3Report.pdf"
    type: "paper-url"
  - title: "Gemma Terms of Use"
    url: "https://ai.google.dev/gemma/terms"
    type: "licence-url"


training:
  tokens: 14_000_000_000_000
  compute_flops: null
  energy_kwh: null
  emissions_co2: null
  training_dataset: "web documents + code + math + images"
  base_model: "Gemma 3 PT 12B"

stats:
  inference_efficiency_tokens_per_kwh: null
  throughput_tokens_per_second: 120
  latency_ms_per_token: 210

region:
  region_deployable:
    - null
  region_developed:
    - “GB-ENG”
