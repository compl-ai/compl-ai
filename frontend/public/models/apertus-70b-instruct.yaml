
name: "Apertus-70B-Instruct-2509"
release_date: "2025-09-02"
open_weights: true
organization: "Swiss AI Initiative"
license: "apache-2.0"

availability:
  - "open-weights"
  - "saas-chat"
  - "api"

description: |
  Apertus-70B-Instruct-2509 is a 70-billion-parameter, decoder-only transformer pretrained on a 15-trillion-token multilingual dataset that includes web text, code, and math. The model is fine-tuned for instruction-following and conversational tasks, making it suitable for chatbots, assistants, and other interactive AI applications. All model weights, training data, training recipes, and documentation are publicly released under a permissive license, encouraging reproducibility, auditing, and custom deployment.

specs:
  architecture: "dense decoder-only transformer"
  knowledge_cutoff: "2024-03"
  total_params: 71000000000
  active_params: 71000000000
  context: 65536
  max_output_tokens: 32768

  modalities:
    input:
      - "text"
    output:
      - "text"

  capabilities:
    - "reasoning"
    - "coding"
    - "multilingual"
    - "math"
    - "tools"

sources:
